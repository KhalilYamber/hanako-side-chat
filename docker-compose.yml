# side-chat 开发 / 测试 / 打包环境（compose 入口）
# 三个服务均 build 自同目录 Dockerfile（镜像 side-chat-dev），源码经卷挂载 .:/app 热更新。
# 用法：
#   构建：docker compose build
#   开发：docker compose run --rm dev            # 等价 node --version（旧用法兼容）
#   测试：docker compose run --rm test           # 跑 4 项必跑测试（见 scripts/run-tests.mjs）
#   打包：docker compose run --rm pack           # 产物 dist/side-chat-<version>.zip + .sha256
#   单项：docker compose run --rm dev node scripts/run-tests.mjs --only <name>
services:
  dev:
    build: .
    image: side-chat-dev
    volumes:
      - .:/app
    working_dir: /app
    # 连宿主服务（如 DSH 3080）：Docker Desktop（Windows/macOS）与 Linux 均兼容的写法
    extra_hosts:
      - "host.docker.internal:host-gateway"
    command: ["node", "--version"]

  test:
    build: .
    image: side-chat-dev
    volumes:
      - .:/app
      # 可选：只读挂载宿主 .hanako，供 smoke-test 索引检查 / 补丁检测使用（不挂载则相关检查优雅跳过）。
      # Windows 请用绝对路径（如 C:/Users/you/.hanako:/hana:ro），与下方 SIDECHAT_HOME 一起启用。
      # - ~/.hanako:/hana:ro
    working_dir: /app
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      # 与上方 .hanako 挂载配合：取消下面这行注释后，SIDECHAT_HOME 指向 /hana
      # SIDECHAT_HOME: /hana
      # dsh-adapter-demo（可选）连的 DSH 服务地址，默认经 host.docker.internal 连宿主 3080
      DSH_BASE_URL: http://host.docker.internal:3080
    command: ["node", "scripts/run-tests.mjs"]

  pack:
    build: .
    image: side-chat-dev
    volumes:
      - .:/app
    working_dir: /app
    extra_hosts:
      - "host.docker.internal:host-gateway"
    command: ["node", "scripts/pack-zip.mjs"]
