<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta http-equiv="Cache-Control" content="no-store">
  <meta http-equiv="Pragma" content="no-cache">
  <script>
    // 就绪握手：host 的 widget 组件靠监听 iframe 的 postMessage("ready") 才把面板置为 ready，
    // 且 host 有 5 秒超时，所以这里用 inline 脚本在 HTML 解析时立即发送，不依赖 app.js 的加载。
    try { window.parent.postMessage({ type: "ready" }, "*"); } catch (e) {}
  </script>
  <link rel="stylesheet" href="/api/plugins/side-chat/assets/widget.css?v=16">
</head>
<body data-surface="widget">
  <div id="app">
    <!-- 顶栏 -->
    <header id="topbar">
      <div id="session-picker">
        <div id="session-picker-main">
          <!-- 自定义会话选择器：触发器显示当前会话标题（含未绑定前缀），点击展开下方列表浮层 -->
          <button id="session-trigger" title="选择会话"><span id="session-trigger-label">（暂无会话，点 ＋ 新建）</span></button>
          <!-- 重命名编辑条：编辑态隐藏触发器并显示此条（含输入框 + 保存/取消 + 就地错误提示） -->
          <div id="rename-bar" class="hidden">
            <input id="rename-input" class="rename-input" placeholder="输入新标题…">
            <button id="btn-rename-ok" class="rename-btn" title="保存">✓</button>
            <button id="btn-rename-cancel" class="rename-btn" title="取消">✕</button>
            <div id="rename-error" class="rename-error hidden"></div>
          </div>
          <!-- 会话列表浮层：点击触发器展开；列表项左键切换会话，右键弹菜单（操作目标=该项） -->
          <div id="session-list" class="hidden"></div>
        </div>
        <button id="btn-new" title="新建会话">＋</button>
      </div>
      <button id="btn-settings" title="设置">⚙</button>
    </header>

    <!-- 参考上下文指示器 -->
    <div id="mainbar" title="点击查看主对话参考上下文预览">
      <span id="main-dot"></span>
      <span id="main-label">主对话：…</span>
    </div>

    <!-- 绑定提示条：辅助会话绑定的主对话 ≠ 当前主会话时显示（renderBindHint 控制显隐），点击一键切换绑定 -->
    <div id="bind-hint" class="hidden" title="点击切换到当前主会话">
      <span id="bind-hint-text"></span>
      <button id="btn-bind-switch">切换</button>
    </div>

    <!-- 消息区 -->
    <main id="messages"></main>

    <!-- 输入区 -->
    <footer id="composer">
      <textarea id="input" rows="2" placeholder="在此提问（参考上下文会自动带入主对话内容）"></textarea>
      <button id="btn-send">发送</button>
    </footer>
  </div>

  <!-- 会话右键菜单：右键触发器（当前会话）或列表项（目标会话）弹出（fixed 浮层，视口内自动收拢），仅「重命名/删除」两项 -->
  <div id="ctx-menu" class="hidden">
    <button id="ctx-menu-rename">✏️ 重命名</button>
    <button id="ctx-menu-del" class="danger">🗑 删除</button>
  </div>

  <!-- 设置面板 -->
  <div id="settings-panel" class="hidden">
    <h3>辅助对话设置</h3>
    <label>参考上下文策略
      <select id="set-context-mode">
        <option value="windowed">最近 N 轮 + 摘要（省 token）</option>
        <option value="full">全量</option>
      </select>
    </label>
    <label id="wrap-window">最近轮数 N
      <input id="set-window" type="number" min="5" max="200" step="5">
    </label>
    <label class="row"><input id="set-thinking" type="checkbox"> 包含主对话思考过程</label>
    <hr>
    <!-- 辅助对话自我意识提示词编辑区：置于上下文设置之后、模型选择（供应商）之前，随「保存设置」一并提交 -->
    <h4>辅助对话自我意识提示词</h4>
    <p class="settings-hint">定义辅助对话的身份与行为准则，作为附加系统提示词注入（不替换原有系统提示词）。默认内容由插件提供，可自由编辑；清空则恢复内置默认。</p>
    <textarea id="set-self-prompt" rows="12"></textarea>
    <hr>
    <h4>供应商</h4>
    <div id="provider-area"></div>
    <hr>
    <h4>运行诊断</h4>
    <button id="btn-diag">运行诊断</button>
    <pre id="diag-output" class="hidden"></pre>
    <button id="btn-close-settings">关闭</button>
  </div>

  <!-- 预览浮层：主对话内容选择器（T6） -->
  <div id="preview-panel" class="hidden">
    <h3>主对话内容</h3>
    <div id="rounds-list"></div>
    <pre id="preview-text" class="hidden"></pre>
    <div class="preview-actions">
      <button id="btn-full-preview">查看完整上下文预览</button>
      <button id="btn-back-list" class="hidden">返回轮次列表</button>
      <button id="btn-close-preview">关闭</button>
    </div>
  </div>

  <script src="/api/plugins/side-chat/assets/app.js?v=25"></script>
</body>
</html>
